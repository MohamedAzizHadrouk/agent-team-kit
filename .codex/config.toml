# Wakil – project config for OpenAI Codex (hand-written, not generated by /wakil.sync-tools).
# After every turn Codex runs this program with the turn payload as last argument: the credit log
# (usage/credits.jsonl) gets one line per prompt, read by Wakil Desktop. Codex reads project config only
# in trusted projects; otherwise run `$wakil-credits sync`.
notify = ["node", "tools/credit-log.cjs", "hook", "--tool", "codex"]
